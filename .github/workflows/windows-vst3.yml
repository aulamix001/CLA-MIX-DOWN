name: Windows VST3
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure Windows x64
        run: cmake -S . -B build -A x64
      - name: Build VST3 and Standalone
        run: cmake --build build --config Release --target MixDownStudy_VST3 MixDownStudy_Standalone MixDownSmoke --parallel 2
      - name: Audio smoke tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package
          Copy-Item 'build/MixDownStudy_artefacts/Release/VST3/MixDown Study.vst3' package -Recurse
          Copy-Item 'build/MixDownStudy_artefacts/Release/Standalone/MixDown Study.exe' package
          Copy-Item 'docs/WINDOWS.md' package
          Compress-Archive -Path 'package/*' -DestinationPath 'MixDown-Study-Windows-x64.zip'
      - name: Publish downloadable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "windows-${{ github.run_number }}" 'MixDown-Study-Windows-x64.zip' --repo '${{ github.repository }}' --target '${{ github.sha }}' --prerelease --title 'Windows x64 prototype #${{ github.run_number }}' --notes 'Independent JUCE prototype with eight XML-derived presets. DSP and interface are approximations. Includes VST3 x64 and Standalone. Original images unchanged.'
      - uses: actions/upload-artifact@v4
        with:
          name: MixDown-Study-Windows-x64
          path: MixDown-Study-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
