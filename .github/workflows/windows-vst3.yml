name: Windows VST3
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            build
            !build/ui-snapshots
            !build/Testing
          key: windows-msvc-juce8-${{ hashFiles('CMakeLists.txt', 'Source/**', 'Tests/**', 'assets/**') }}
          restore-keys: windows-msvc-juce8-
      - name: Configure Windows x64
        run: cmake -S . -B build -A x64
      - name: Build VST3 and Standalone
        shell: pwsh
        run: |
          cmake --build build --config Release --target MixDownStudy_VST3 MixDownStudy_Standalone MixDownSmoke MixDownUiSmoke --parallel 2 2>&1 | Tee-Object -FilePath windows-build.log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            Get-Content windows-build.log | Where-Object { $_ -match 'error (C[0-9]+|LNK[0-9]+|MSB[0-9]+)|fatal error' } | Select-Object -First 20 | ForEach-Object {
              $message = $_.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Windows compiler::$message"
            }
          }
          exit $buildExitCode
      - name: Audio and interface smoke tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package
          Copy-Item 'build/MixDownStudy_artefacts/Release/VST3/MixDown Study.vst3' package -Recurse
          Copy-Item 'build/MixDownStudy_artefacts/Release/Standalone/MixDown Study.exe' package
          Copy-Item 'docs/WINDOWS.md' package
          Compress-Archive -Path 'package/*' -DestinationPath 'MixDown-Study-Windows-x64.zip'
      - name: Publish downloadable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $preview = Get-ChildItem 'build/ui-snapshots' -Recurse -Filter 'panel-default.png' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $preview) { throw 'The current UI test did not produce its preview.' }
          gh release create "windows-${{ github.run_number }}" 'MixDown-Study-Windows-x64.zip' $preview.FullName --repo '${{ github.repository }}' --target '${{ github.sha }}' --prerelease --title 'Windows x64 visual panel 0.2 #${{ github.run_number }}' --notes 'High-resolution original panel artwork embedded byte for byte. Animated VUs, LED meters, hardware faders, section switches, IN/GR/OUT, A/B, presets and toolbar. Includes VST3 x64 and Standalone. Audio and UI smoke tests passed. DSP remains an independent approximation.'
      - uses: actions/upload-artifact@v4
        with:
          name: MixDown-Study-Windows-x64
          path: MixDown-Study-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UI-snapshots
          path: build/ui-snapshots/**/*.png
          if-no-files-found: ignore
      - uses: actions/cache/save@v4
        if: failure()
        with:
          path: |
            build
            !build/ui-snapshots
            !build/Testing
          key: windows-msvc-juce8-${{ hashFiles('CMakeLists.txt', 'Source/**', 'Tests/**', 'assets/**') }}
